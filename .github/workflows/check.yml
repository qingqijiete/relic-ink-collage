name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile scripts
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Check CLI entry points
        run: |
          python scripts/make_refboard.py --help > /dev/null
          python scripts/clean_corner.py --help > /dev/null
          python scripts/assemble_grid.py --help > /dev/null

      - name: Run smoke test
        run: python tests/smoke_test.py
